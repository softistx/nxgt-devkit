name: Newest peers

# The newest end of every peer range, on a schedule: a TypeScript 7, graphql
# 17, msw 3 or Playwright release can break a peer range with no change here,
# and a pull request is not the place to find out. Weekly, and on demand from
# the Actions tab (before a release). It is not a required check, and not part
# of ci.yml: the `ci` job checks what a pull request changes, and nothing
# changed.
# Ported from softistx/graphql's workflow of the same name, and adapted: this
# repository's specs drive a real Chromium, so the browser is installed too.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest-peers:
    # Resolves without a lockfile, so an upstream release can turn it red with
    # no change here: read it, then fix the range or the code in a pull
    # request. Never widen or narrow a range to make it green.
    name: Newest peers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      # Rewrites the manifests in this checkout only, then installs what they
      # now name. The lockfile goes: its versions satisfy the rewritten
      # ranges, so an install that kept it would test the oldest end again.
      - name: Use the newest peers
        run: bun scripts/newest-peers.ts && rm bun.lock && bun install
      # Which versions this run resolved, so a red run names the release.
      - name: Resolved peers
        run: bun pm ls --all | grep -E '[ ─](graphql|msw|@msw/playwright|@playwright/test|typescript)@' | sort -u || true
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # The package's own Playwright, at the version this run resolved.
      - name: Install Chromium
        working-directory: packages/playwright
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: Run tests
        run: bun run test
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
