name: CI

on:
  pull_request:
    # `feat/**` too: an effort built with large-feature-branch-workflow merges
    # each slice into its integration branch `feat/<slug>` without waiting for
    # a human, and those slices need CI as much as a pull request to develop.
    branches: [develop, main, 'feat/**']
  # On `develop` as well, so the Playwright browser cache is written under
  # `refs/heads/develop`, the one scope every pull request can read. A cache
  # written by a pull request is readable by that pull request only.
  push:
    branches: [develop]

jobs:
  ci:
    name: CI
    # GitHub-hosted: this repository is public, so the minutes are free.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint code
        run: biome ci
      # Build FIRST: every package's `exports` points at `./dist/*`, so on a
      # clean checkout a sibling import resolves to nothing until it is built.
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # @nxgt/playwright's e2e specs drive a real Chromium. The browser is
      # keyed on the installed playwright version, which the lockfile pins.
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The package's own Playwright: a bare `bunx playwright` at the root finds
      # no local bin and downloads the latest, whose browser build differs.
      - name: Install Chromium
        working-directory: packages/playwright
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: Run tests
        run: bun run test
      # @nxgt/msw-graphql promises graphql ^16 || ^17 and msw ^2.12.10 || ^3;
      # the workspace holds graphql 17 and msw 3, so the other majors run in a
      # scratch copy (install, build, typecheck, specs, Node smoke test).
      - name: msw-graphql on graphql 16 and on msw 2
        working-directory: packages/msw-graphql
        run: |
          bun run scripts/test-matrix.ts 16 3.0.3
          bun run scripts/test-matrix.ts 17 2.15.0
      # The build exits 0 on packages that throw the instant they are imported.
      # This packs them, installs them as a consumer does and imports every
      # declared subpath but the browser-only ones.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # A change to a package without a changeset never reaches a consumer.
      # Not on the release branch, which consumes the changesets, and not on a
      # push, where the diff against origin/develop is empty.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status

  newest-peers:
    # The job above runs the lockfile's toolchain: the oldest end of each peer
    # range. This one runs the newest end (TypeScript 7, graphql 17, msw 3,
    # the latest Playwright and @msw/playwright the ranges accept) so a range
    # stays true after the release that would break it. It resolves without a
    # lockfile, so an upstream release can turn it red with no change here:
    # read it, do not make it a required check. newest-peers.yml runs the same
    # steps weekly; change both together.
    name: Newest peers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      # Rewrites the manifests in this checkout only, then installs what they
      # now name. The lockfile goes: its versions satisfy the rewritten
      # ranges, so an install that kept it would test the oldest end again.
      - name: Use the newest peers
        run: bun scripts/newest-peers.ts && rm bun.lock && bun install
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      - name: Install Chromium
        working-directory: packages/playwright
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: Run tests
        run: bun run test
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
